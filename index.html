      for(const d of DRIP){const dx=x0+d.x*w1,tp=P0+((dx-x0+6)/(tw+12))*PD;if(tt>tp+.25){const wd=Math.max(1.2,fs*.006),l=Math.min(d.len*fs,(tt-tp-.25)*fs*.06);g.fillRect(dx,bot-fs*.05,wd,l);g.beginPath();g.arc(dx+wd/2,bot-fs*.05+l,wd*.95,0,7);g.fill()}}
      const sa=ease((tt-42.0)/.6);if(sa>0){const ss=h*.045;g.font="300 "+ss+"px "+DISP;g.textAlign="center";g.fillStyle="rgba(244,242,238,"+(.85*sa)+")";g.fillText(L.slogan,w/2,bot+h*.15)}
      g.globalAlpha=1;
    }
  });
  // ---- layer 1: the studio panel
  if(p2x!=null)layer(.92,()=>{
    panel(g,p2x,h/2+settle(STOP2)*h*.004,P2W,P2H,p2k,{side:1,f1:"#151517",f2:"#0a0a0b",edge:"#232326",hi:"rgba(255,255,255,.16)"},(g,pw,ph)=>{
      g.textAlign="center";g.textBaseline="alphabetic";
      const s0=ph*.036;g.font="300 "+s0+"px "+DISP;g.fillStyle="rgba(244,242,238,.42)";g.fillText("3205.ai",0,-ph*.26);
      const s1=Math.min(ph*.085,pw*.046);g.font="300 "+s1+"px "+DISP;g.fillStyle="#f4f2ee";g.fillText(L.build,0,ph*.02);
      g.fillStyle="rgba(244,242,238,.25)";g.fillRect(-ph*.04,ph*.09,ph*.08,1);
      const s2=ph*.028;g.font="300 "+s2+"px "+DISP;g.fillStyle="rgba(244,242,238,.3)";g.fillText("№ 3205 · 2026",0,ph*.36);
    });
    if(md==="pull"&&dir===1){rope=1}
  });
  // ---- layer 2: the "opening soon" card + the man
  layer(1,(sc)=>{
    if(p3x!=null)panel(g,p3x,P3Y+settle(STOP3)*h*.004,P3W,P3H,p3k,{side:-1,f1:"#f3f1eb",f2:"#e2dfd7",edge:"#a9a69e",hi:"rgba(255,255,255,.7)"},(g,pw,ph)=>{
      g.textAlign="center";g.textBaseline="alphabetic";
      const s0=ph*.056;g.font="300 "+s0+"px "+DISP;g.fillStyle="rgba(17,17,19,.5)";g.fillText("3205.ai",0,-ph*.2);
      const s1=Math.min(ph*.17,pw*.085);g.font="300 "+s1+"px "+DISP;g.fillStyle="#111113";g.fillText(L.open,0,ph*.1);
      g.fillStyle="rgba(17,17,19,.3)";g.fillRect(-ph*.05,ph*.2,ph*.1,1);

    if(tt>37.2&&fx<w+o.Hf*2.5&&fx>-o.Hf*2.5){

      const f=figure(g,fx,md,dir,tt,o,face);

  const z=ease((tt-ZTM)/.9);if(z>0){g.fillStyle="rgba(0,0,0,"+z+")";g.fillRect(0,0,w,h)}
}

/* ============ grain ============ */
const gr=document.createElement("canvas");gr.width=gr.height=160;const gx=gr.getContext("2d");let gPat=null,gF=0;
function grain(g){if(gF++%2===0||!gPat){const d=gx.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}gx.putImageData(d,0,0);gPat=g.createPattern(gr,"repeat")}g.save();g.globalAlpha=.055;g.globalCompositeOperation="overlay";g.fillStyle=gPat;g.fillRect(0,0,W,H);g.restore()}

/* ============ update ============ */
const _v=new THREE.Vector3(),vel=new THREE.Vector3();
let lastT=-1;
function update(tt,full){
  evalCam(tt,camP,camQ);
  const amp=tt<7?.004:tt>37?0:.012;camP.x+=Math.sin(tt*.53)*amp;camP.y+=Math.sin(tt*.71+1)*amp*.7;
  camera.position.copy(camP);camera.lookAt(camQ);
  camera.fov=30+(tt>37&&tt<41?easeIn((tt-37)/4)*6*(1-ease((tt-40.3)/.7)):0)+(tt>16&&tt<19.8?env(tt,16,17.4,18.4,19.8)*6:0);
  camera.near=tt<3?.01:.05;camera.updateProjectionMatrix();
  // velocity for streaks
  const dtt=tt-lastT;if(dtt>0&&dtt<.2){vel.copy(camP).sub(prevP).divideScalar(dtt)}else vel.set(0,0,0);prevP.copy(camP);lastT=tt;
  const focus=camP.distanceTo(camQ);
  const dofK=tt<7?0:tt<22.5?.28:tt<24?lerp(.28,.08,ease((tt-22.5)/1.5)):tt<37?.08:0;
  const fogD=tt<3?.11:tt<7?.07:tt<12?.06:tt<21?.045:tt<24?.03:tt<32.4?.032:tt<35.6?lerp(.032,.005,ease((tt-32.4)/3.2)):tt<37?.005:lerp(.005,.02,ease((tt-37)/4));
  scene.fog.density=fogD;
  for(const m of ALLM){const u=m.uniforms;u.fogD.value=fogD;u.focus.value=focus;u.dofK.value=dofK}
  bloom.strength=tt<7?.9:tt<12?.75:.55;
  // ---- keyboard
  kb.visible=tt<12.2;floor.visible=tt<11.5;
  if(kb.visible){
    sweep.position.set(camP.x+1.6,.18,tt<3?-.9:camP.z-.6);sweep.intensity=tt<3?5:env(tt,2.8,3.4,6.5,8)*4;
    rim.intensity=env(tt,.5,2,9,11)*.9;
    const kA=ease(tt/1.2);
    for(const k of keys){
      k.mat.envMapIntensity=.6*kA;
      if(k.pi>=0){
        const pt=PRESS[k.pi],press=env(tt,pt-.05,pt+.04,pt+.1,pt+.36),lit=ease((tt-pt)/.18);
        k.leg.material.opacity=lerp(.3*kA,1,lit);k.leg.material.color.setScalar(lerp(1,1.7,lit));k.ol.material.opacity=lit;k.mat.emissiveIntensity=lit*.08;
        const Lt=keyLights[k.pi];if(Lt){Lt.intensity=lit*1.7*(1-ease((tt-7)/1.5));Lt.position.set(k.x,.32,k.z)}
        const fly=clamp((tt-6.5-k.pi*.14)/2.1,0,1);
        if(fly>0){
          const s=ease(fly),e=easeOut(fly),tp=ideaKeyTargets[k.pi];
          k.g.position.set(lerp(k.x,tp.x,s),lerp(.14,tp.y,e)+Math.sin(s*Math.PI)*.9,lerp(k.z,tp.z,s));
          k.g.rotation.set(lerp(0,Math.PI/2,s),Math.sin(s*Math.PI)*.6*(k.pi%2?1:-1),Math.sin(s*Math.PI)*.25);
          k.g.scale.setScalar(lerp(1,IKW/KEY,s));k.mat.envMapIntensity=lerp(.6,1,s);
        }else{k.g.position.set(k.x,.14-press*.08,k.z);k.g.rotation.set(0,0,0);k.g.scale.setScalar(1)}
      }else{
        k.leg.material.opacity=.3*kA*(1-k.flown);k.ol.material.opacity=0;k.flown=0;
      }
    }
  }else{for(const L of keyLights)L.intensity=0}
  // ---- flying glyphs and settled words
  layerG.visible=full&&tt>7&&tt<16.5;
  if(layerG.visible){
    for(const f of FLY){
      const u=clamp((tt-f.t0)/f.dur,0,1),s=ease(u);
      if(u<=0){f.m.visible=false;continue}f.m.visible=true;
      const p=f.m.position;p.lerpVectors(f.src,f.dst,s);p.y+=Math.sin(s*Math.PI)*f.arc;p.x+=Math.sin(s*Math.PI)*f.arc*.25*(f.spin>0?1:-1);
      f.m.rotation.z=(1-s)*f.spin;
      const settle=ease((tt-f.settle)/.4),hot=1-ease((u-.6)/.4);
      const U=f.m.material.uniforms;U.opacity.value=ease(u*4)*f.op*(1-settle);U.tint.value.copy(f.tint).multiplyScalar(1+hot*.9);
      if(u<1&&f.key)f.key.flown=Math.max(f.key.flown||0,1);
    }
    for(const s of SETTLED){s.m.material.uniforms.opacity.value=ease((tt-s.t)/.4)*s.op}
  }
  // ---- deep layers + stars
  deepG.visible=tt>11&&tt<25;
  if(deepG.visible){
    const fa=1-ease((tt-22.6)/2);
    for(const d of DEEP){
      const mats=d.mats||[d.m.material];let a=ease((tt-11.5)/1.2)*fa;
      if(d.unfold){const k=ease((tt-d.unfold.t)/.7);if(d.unfold.role==="word")a*=1-k;else{a*=k;d.m.scale.set(1.12*lerp(.3,1,k),.63*lerp(.1,1,k),1)}}
      for(const m of mats)m.uniforms.opacity.value=a*(m.userData.o!=null?m.userData.o:1);
      if(d.img&&!d.fit&&d.mats){d.fit=coverFit(d.mats[0],d.img)}
      d.m.position.y=d.base.y+Math.sin(tt*.4+d.ph)*.05;
      d.m.lookAt(camP);
    }
  }
  bgG.visible=tt>17&&tt<37.6;
  if(bgG.visible){const a=env(tt,17,19.5,33.5,37.4);
    for(const d of BG){for(const m of d.mats)m.uniforms.opacity.value=a*.85;if(d.img&&!d.fit)d.fit=coverFit(d.mats[0],d.img);
      if(d.fall){d.m.position.y=d.base.y-((tt*d.sp+d.ph)%6)+3;d.m.rotation.z=Math.sin(tt*.6+d.ph)*.3}else{d.m.position.x=d.base.x+Math.sin(tt*d.sp+d.ph)*.6;d.m.position.y=d.base.y+Math.cos(tt*d.sp*.8+d.ph)*.3}}}
  starG.visible=tt>9&&tt<25;
  if(starG.visible){
    const sp=vel.length(),k=Math.min(.09,.05),lim=Math.min(4,sp*k);
    _v.copy(vel).normalize().multiplyScalar(-lim);
    for(let i=0;i<STARS.length;i++){const s=STARS[i];starPos[i*6]=s.x;starPos[i*6+1]=s.y;starPos[i*6+2]=s.z;starPos[i*6+3]=s.x+_v.x;starPos[i*6+4]=s.y+_v.y;starPos[i*6+5]=s.z+_v.z}
    starGeo.attributes.position.needsUpdate=true;
    const a=env(tt,9.5,12,22.4,24.6);starG.children[0].material.opacity=a*clamp(sp/12,0,1)*.9;starG.children[1].material.opacity=a*.75;
  }
  // ---- workflow
  wf.visible=tt>12.5;
  if(wf.visible){
    dots.material.opacity=env(tt,24,26,37.5,39.5)*.22;
    for(const f of FIELDS){const a=ease((tt-f.t)/.9);f.mat.uniforms.opacity.value=a;f.lab.material.uniforms.opacity.value=a*.9}
    const L=TXT[lang];
    for(const n of NODES){
      let a=ease((tt-n.t)/(n.o.hero?1:.55));
      const U=n.mat.uniforms;
      if(n===HERO){
        a=ease((tt-13)/1.5);
        U.bCol.value.setScalar(lerp(1.3,.24,ease((tt-23.2)/1.2)));U.bOp.value=lerp(.6,.9,ease((tt-23.2)/1.2));U.radius.value=lerp(.02,.08,ease((tt-23.4)/1));
        const alive=tt>20.6,tex=alive?vtex("v_hero"):IMG.v_hero;if(U.map.value!==tex){U.map.value=tex;n._fit=0}
        if(alive&&!n._st){n._st=1;const V=VID.v_hero;if(V)try{V.el.currentTime=0}catch(e){}}if(!alive)n._st=0;
        U.scrim.value=ease((tt-23.6)/1);
      }else if(n===MONTN){
        const list=MONT_LIST,idx=tt<29.2?0:Math.floor((tt-29.2)/.42)%list.length,tex=vtex(list[idx]);if(U.map.value!==tex){U.map.value=tex;n._fit=0}
      }else if(n===FILM){
        if(tt<31.5){U.kind.value=0}
        else if(tt<37.0){U.kind.value=1;const list=FILM_LIST,idx=Math.floor((tt-31.5)/.5)%list.length,tex=vtex(list[idx]);if(U.map.value!==tex){U.map.value=tex;n._fit=0}U.bright.value=.92*(1-ease((tt-36.3)/.7))}
        else{U.kind.value=1;U.bright.value=1;if(U.map.value!==filmTex){U.map.value=filmTex;n._fit=0}}
        U.bOp.value=lerp(.75,0,ease((tt-40.2)/.8));U.scrim.value=0;
      }else if(n.vid){const tex=vtex(n.vid);if(U.map.value!==tex){U.map.value=tex;n._fit=0}}
      if(!n._fit&&U.map.value)n._fit=coverFit(n.mat,U.map.value);
      U.opacity.value=a;
      n.m.position.z=n===HERO?0:-(1-a)*.6;
      if(n.lab){n.lab.material.uniforms.opacity.value=(n===HERO?0:a)*(n===FILM?.9*(1-ease((tt-36.6)/1)):.9);n.lab.position.z=n.m.position.z+.002}
      if(n!==HERO&&n!==FILM){const fresh=tt>n.t&&tt<n.t+1.2;U.bCol.value.setScalar(fresh?lerp(1.5,.24,ease((tt-n.t)/1.2)):.24)}
    }
    for(const w of WIRES){
      const p=ease((tt-w.t0)/w.dur);w.m.visible=p>0;
      if(p>0){w.geo.setDrawRange(0,Math.floor(p*w.N)*6);const hp=w.pts[Math.floor(p*w.N)];w.head.position.set(hp.x,hp.y,0);w.head.material.opacity=p<1?1:0;
        const sk=tt-(w.t0+w.dur),end=w.pts[w.N];w.spark.position.set(end.x,end.y,.01);w.spark.material.opacity=sk>0&&sk<.35?(1-sk/.35):0;w.spark.scale.setScalar(.25+sk*1.2);
        if(p>=1){const u=(tt*.45+w.ph)%1,q=w.pts[Math.floor(u*w.N)];w.pulse.position.set(q.x,q.y,0);w.pulse.material.opacity=.8*Math.sin(u*Math.PI)}else w.pulse.material.opacity=0;
        if(w.port&&p>=.98)w.port.filled=1;
      }else{w.head.material.opacity=0;w.pulse.material.opacity=0;w.spark.material.opacity=0}
    }
    for(const p of PORTS){const a=p.n===HERO?ease((tt-24.8)/.6):p.n.mat.uniforms.opacity.value;p.mat.uniforms.opacity.value=a;p.mat.uniforms.fillA.value=p.filled;p.mat.uniforms.bOp.value=p.filled?0:.35;p.filled=0}
  }
}

/* ============ frame loop ============ */
const watch=$("watch"),pf=$("pf"),timeEl=$("time"),playBtn=$("play");
function render(){
  if(!ready)return;
  const tt=warpV(t),full=mode==="full";
  octx.setTransform(DPR,0,0,DPR,0,0);octx.clearRect(0,0,W,H);
  if(tt>=37.0&&tt<41.05){const g=filmCanvas.getContext("2d");drawFinale(g,filmCanvas.width,filmCanvas.height,tt);filmTex.needsUpdate=true}
  if(full&&tt>=41.0){drawFinale(octx,W,H,tt)}
  else{update(tt,full);composer.render()}
  if(wantAll)manageVideos(tt);
  let blk=0;
  if(full)blk=Math.max(blk,1-ease(tt/.9));
  if(!full)blk=Math.max(blk,1-env(t,LOOP_A,LOOP_A+1.2,LOOP_B-1.2,LOOP_B));
  if(blk>0){octx.fillStyle="rgba(0,0,0,"+blk+")";octx.fillRect(0,0,W,H)}
  grain(octx);
  const prog=full?t/TOTAL:(t-LOOP_A)/(LOOP_B-LOOP_A);pf.style.width=(clamp(prog,0,1)*100).toFixed(2)+"%";
  const sec=Math.floor(full?t:t-LOOP_A),tot=Math.round(full?TOTAL:LOOP_B-LOOP_A);
  timeEl.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")+" / "+Math.floor(tot/60)+":"+String(tot%60).padStart(2,"0");
}
function frame(ts){
  if(lastTs==null)lastTs=ts;const dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;
  if(playing&&ready){t+=dt;if(mode==="full"&&t>=TOTAL){t=TOTAL;setPlaying(false)}if(mode==="loop"&&t>=LOOP_B){t=LOOP_A+(t-LOOP_B);lastT=-1}}
  syncAudio();render();requestAnimationFrame(frame);
}

/* ============ sound ============ */
const snd=new Audio();snd.preload="auto";
snd.src="a/intro3.mp3";
let soundOn=true,gesture=false;
function syncAudio(){
  const want=soundOn&&gesture&&playing&&mode==="full"&&t<TOTAL-.05;
  if(want){
    if(snd.paused){try{snd.currentTime=t}catch(e){}const p=snd.play();if(p&&p.catch)p.catch(()=>{})}
    else{const d=snd.currentTime-t;if(Math.abs(d)>.15){try{snd.currentTime=t}catch(e){}}else if(snd.readyState>=3)t=snd.currentTime}
  }else if(!snd.paused)snd.pause();
}
/* ============ UI ============ */
function setPlaying(v){playing=v;$("end").hidden=!(!v&&mode==="full"&&t>=TOTAL);playBtn.textContent=v?"Пауза":(mode==="full"&&t>=TOTAL?"Ещё раз":"Смотреть")}
function press(ids,on){for(const id of ids)$(id).setAttribute("aria-pressed",id===on)}
function rebuildAll(){buildKeyboard();buildCam();buildLayers();buildDeep(pathFn);relabel()}
function setLang(l){lang=l;press(["lang-ru","lang-en"],"lang-"+l);watch.textContent=TXT[l].watch;if(ready)rebuildAll()}
function setMode(m){mode=m;press(["mode-full","mode-loop"],"mode-"+m);watch.hidden=m!=="loop";if(typeof hint!=="undefined")hint.hidden=gesture||m!=="full";t=m==="full"?0:LOOP_A;lastT=-1;setPlaying(true)}
$("lang-ru").onclick=()=>setLang("ru");$("lang-en").onclick=()=>setLang("en");
$("mode-full").onclick=()=>setMode("full");$("mode-loop").onclick=()=>setMode("loop");
playBtn.onclick=()=>{gesture=true;hint.hidden=true;startVideos();if(mode==="full"&&t>=TOTAL){t=0;lastT=-1;setPlaying(true);return}setPlaying(!playing)};
$("again").onclick=()=>{gesture=true;hint.hidden=true;startVideos();t=mode==="full"?0:LOOP_A;lastT=-1;setPlaying(true)};
const hint=$("hint");
function firstGesture(){if(gesture)return false;gesture=true;hint.hidden=true;startVideos();if(mode==="full"){t=0;lastT=-1;setPlaying(true)}return true}
$("snd").onclick=()=>{soundOn=!soundOn;$("snd").setAttribute("aria-pressed",soundOn);$("snd").textContent=soundOn?"Звук: вкл":"Звук: выкл";if(soundOn&&!gesture)firstGesture()};
stage.addEventListener("click",()=>{if(firstGesture())return;startVideos();if(mode==="loop"){setMode("full");return}if(t>=TOTAL){t=0;lastT=-1;setPlaying(true);return}setPlaying(!playing)});
stage.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();stage.click()}});
function resize(){const r=stage.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);DPR=Math.min(2,window.devicePixelRatio||1);
  renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);composer.setPixelRatio(DPR);composer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();
  ov.width=Math.round(W*DPR);ov.height=Math.round(H*DPR);gPat=null}
new ResizeObserver(resize).observe(stage);resize();
setLang("ru");
window.__seek=x=>{t=x;lastT=-1;setPlaying(false)};window.__play=()=>setPlaying(true);window.__ready=()=>ready&&pending<=0;
const fl=["300 120px 'Inter Tight'","400 64px 'Inter Tight'","300 120px 'Helvetica Neue'"].map(s=>document.fonts?document.fonts.load(s,"ИДЕЯ idea"):null);
function go(){if(ready)return;buildKeyboard();buildCam();buildWorkflow();buildLayers();buildDeep(pathFn);ready=true;$("load").style.opacity=0;startVideos();
  let reduce=false;try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}if(reduce){t=30;setPlaying(false)}}
Promise.race([Promise.all(fl),new Promise(r=>setTimeout(r,2500))]).then(go,go);
requestAnimationFrame(frame);
})();
